<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>সোলাইমানী খাবনামা</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600&display=swap');
[data-theme="light"]{--em:#1b4d3e;--el:#2d6a4f;--go:#b8860b;--gl:#d4a017;--gp:#f0e0a0;--rd:#8b1a1a;--cr:#faf6ed;--pg:#f5efe0;--pd:#e8dcc5;--sh:rgba(26,16,8,0.15);--ink:#1a1008;--ink2:#3a2a10;--ink3:#6a5030;--hbg:#1b4d3e;--hbg2:#0d2b22;--card:#faf6ed;--bd:#f0e0a0;--tab:#e8dcc5;--dua:#fff8e7;--dub:#d4a017}
[data-theme="dark"]{--em:#4caf87;--el:#5dc498;--go:#d4a017;--gl:#e8b830;--gp:#3a3010;--rd:#c0392b;--cr:#1a1a1a;--pg:#121212;--pd:#1e1e1e;--sh:rgba(0,0,0,0.4);--ink:#e8e0d0;--ink2:#c8b898;--ink3:#8a7a60;--hbg:#0d2b22;--hbg2:#071a14;--card:#1e1e1e;--bd:#2a2a2a;--tab:#181818;--dua:#1a1500;--dub:#5a4010}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans Bengali",sans-serif;background:var(--pg);color:var(--ink);min-height:100vh;transition:background .3s,color .3s}
header{background:linear-gradient(135deg,var(--hbg),var(--hbg2));position:sticky;top:0;z-index:100;box-shadow:0 2px 12px var(--sh);border-bottom:2px solid var(--go)}
.ht{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px}
.htc{display:flex;flex-direction:column;align-items:center;flex:1}
.at{font-family:"Noto Serif Bengali",serif;font-size:18px;font-weight:700;color:var(--gl)}
.as{font-size:10px;color:#a8c5b0;margin-top:1px}
.wm{background:var(--rd);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:3px;flex-shrink:0}
.hbtns{display:flex;gap:4px;align-items:center;flex-shrink:0}
.hb{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:18px;color:#fff;font-size:10px;padding:4px 7px;cursor:pointer;font-family:"Noto Sans Bengali",sans-serif;white-space:nowrap}
.sw{padding:6px 10px 8px;display:flex;gap:6px;align-items:center}
.sb{flex:1;display:flex;align-items:center;background:rgba(255,255,255,0.12);border:1px solid rgba(212,160,23,0.4);border-radius:24px;overflow:hidden}
.si{padding:0 8px;color:var(--gl);font-size:15px}
#si{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:"Noto Sans Bengali",sans-serif;font-size:13px;padding:8px 0}
#si::placeholder{color:rgba(255,255,255,0.5)}
#bc{background:none;border:none;color:rgba(255,255,255,0.6);padding:0 8px;font-size:16px;cursor:pointer;display:none}
.ba{background:linear-gradient(135deg,var(--go),var(--gl));border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,0.3);flex-shrink:0}
.tabs{display:flex;background:var(--tab);border-bottom:2px solid var(--go)}
.tab{flex:1;padding:9px 2px;font-size:11px;font-family:"Noto Sans Bengali",sans-serif;font-weight:500;color:var(--ink3);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.tab.active{color:var(--em);border-bottom-color:var(--em);font-weight:600}
main{padding:10px;min-height:calc(100vh - 130px)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.cc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;box-shadow:0 2px 6px var(--sh);position:relative;overflow:hidden}
.cc:active{transform:scale(0.97)}
.cc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--go),var(--em))}
.ci{font-size:24px;margin-bottom:4px}
.cn{font-family:"Noto Serif Bengali",serif;font-size:12px;font-weight:600;color:var(--em)}
.ck{font-size:10px;color:var(--ink3);margin-top:2px}
.dl{display:flex;flex-direction:column;gap:8px}
.dc{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;box-shadow:0 2px 6px var(--sh)}
.dh{display:flex;align-items:center;padding:10px 12px;gap:8px;cursor:pointer}
.di{font-size:20px;flex-shrink:0}
.dtw{flex:1}
.dt{font-family:"Noto Serif Bengali",serif;font-size:13px;font-weight:600;line-height:1.4;color:var(--ink)}
.dk{font-size:11px;color:var(--ink3);margin-top:2px}
.de{color:var(--go);font-size:16px}
.db{display:none;border-top:1px solid var(--bd)}
.db.open{display:block}
.tr{display:flex;background:var(--tab);border-bottom:1px solid var(--bd);overflow-x:auto}
.tb{flex-shrink:0;padding:6px 8px;font-size:10px;font-family:"Noto Sans Bengali",sans-serif;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink3);font-weight:500;white-space:nowrap}
.tb.active{color:var(--em);border-bottom-color:var(--em);font-weight:600}
.tc{padding:10px;font-size:13px;line-height:1.8;color:var(--ink2)}
.tp{display:none}
.tp.active{display:block}
.sb2{display:inline-block;background:linear-gradient(90deg,var(--em),var(--el));color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;margin-bottom:6px}
.dua-box{background:var(--dua);border:1px solid var(--dub);border-radius:8px;padding:10px;margin-top:8px}
.dua-t{font-size:11px;font-weight:600;color:var(--go);margin-bottom:4px}
.dua-ar{font-size:15px;text-align:right;direction:rtl;line-height:2;margin-bottom:4px;color:var(--ink)}
.dua-bn{font-size:11px;color:var(--ink3);line-height:1.6;margin-bottom:4px}
.kar{background:rgba(27,77,62,0.08);border-left:3px solid var(--em);padding:6px 8px;margin-top:6px;border-radius:0 6px 6px 0;font-size:12px;color:var(--ink2);line-height:1.6}
.kar-t{font-size:11px;font-weight:700;color:var(--em);margin-bottom:3px}
.rc{font-size:12px;color:var(--ink3);margin-bottom:10px;padding:6px 10px;background:var(--bd);border-radius:6px}
.panel{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--go);border-radius:16px 16px 0 0;padding:14px;max-height:75vh;overflow-y:auto;z-index:200;box-shadow:0 -4px 20px var(--sh)}
.panel.open{display:block}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pt{flex:1;font-family:"Noto Serif Bengali",serif;font-size:14px;font-weight:600;color:var(--em)}
.pc{background:none;border:none;font-size:20px;color:var(--ink3);cursor:pointer}
.air{display:flex;gap:8px;margin-bottom:10px}
#ai{flex:1;border:1.5px solid var(--bd);border-radius:20px;padding:9px 12px;font-family:"Noto Sans Bengali",sans-serif;font-size:13px;background:var(--pg);outline:none;color:var(--ink)}
#ai:focus{border-color:var(--em)}
.bask{background:linear-gradient(135deg,var(--em),var(--el));color:#fff;border:none;border-radius:20px;padding:9px 14px;font-family:"Noto Sans Bengali",sans-serif;font-size:12px;font-weight:600;cursor:pointer}
.ar{background:var(--pg);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:13px;line-height:1.8;min-height:60px;color:var(--ink)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:199}
.ov.open{display:block}
.sh2{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.shi{font-size:18px}
.sht{font-family:"Noto Serif Bengali",serif;font-size:15px;font-weight:700;color:var(--em);flex:1}
.bbk{background:none;border:1px solid var(--go);border-radius:18px;padding:4px 10px;font-family:"Noto Sans Bengali",sans-serif;font-size:11px;color:var(--go);cursor:pointer}
.bism{text-align:center;font-family:"Noto Serif Bengali",serif;font-size:17px;color:var(--go);padding:12px;background:linear-gradient(135deg,var(--hbg),var(--hbg2));border-radius:10px;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--em);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:300;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.acard{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.acard h3{font-family:"Noto Serif Bengali",serif;font-size:13px;font-weight:700;color:var(--em);margin-bottom:6px}
.acard p{font-size:12px;line-height:1.8;color:var(--ink2)}
.nr{text-align:center;padding:30px 20px;color:var(--ink3)}
.si-row{margin-bottom:10px}
.si-label{font-size:12px;font-weight:600;color:var(--em);margin-bottom:4px}
.si-inp{width:100%;border:1.5px solid var(--bd);border-radius:8px;padding:9px 10px;font-family:"Noto Sans Bengali",sans-serif;font-size:12px;background:var(--pg);outline:none;color:var(--ink)}
.si-inp:focus{border-color:var(--em)}
.si-note{font-size:10px;color:var(--ink3);margin-top:4px;line-height:1.5}
.si-save{background:linear-gradient(135deg,var(--em),var(--el));color:#fff;border:none;border-radius:20px;padding:10px;font-family:"Noto Sans Bengali",sans-serif;font-size:13px;font-weight:600;cursor:pointer;width:100%}
.fs-row{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:8px}
.fsb{background:var(--em);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;font-weight:700}
.fsv{font-family:"Noto Serif Bengali",serif;font-size:18px;font-weight:700;color:var(--em);min-width:50px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="ht">
    <span class="wm">@A.M.MORSHED</span>
    <div class="htc">
      <div class="at">&#x1F319; সোলাইমানী খাবনামা</div>
      <div class="as">ইসলামী স্বপ্নের ব্যাখ্যা &#x2014; ৬ আলেম</div>
    </div>
    <div class="hbtns">
      <button class="hb" onclick="togDark()" id="dmB">&#x1F319; &#x09A1;&#x09BE;&#x09B0;&#x09CD;&#x0995;</button>
      <button class="hb" onclick="togFS()">&#x1F524;</button>
      <button class="hb" onclick="togSet()">&#x2699;&#xFE0F;</button>
    </div>
  </div>
  <div class="sw">
    <div class="sb">
      <span class="si">&#x1F50D;</span>
      <input type="text" id="si" placeholder="স্বপ্নের বিষয় লিখুন..." oninput="onSrch(this.value)">
      <button id="bc" onclick="clrSrch()">&#x2715;</button>
    </div>
    <button class="ba" onclick="togAI()">&#x1F916;</button>
  </div>
</header>
<div class="tabs">
  <button class="tab active" onclick="showTab('home')">&#x1F3E0; হোম</button>
  <button class="tab" onclick="showTab('cat')">&#x1F4C2; বিভাগ</button>
  <button class="tab" onclick="showTab('all')">&#x1F4D6; সব</button>
  <button class="tab" onclick="showTab('about')">&#x2139;&#xFE0F; পরিচিতি</button>
</div>
<main id="mc"></main>
<div class="ov" id="ov" onclick="closeAll()"></div>

<div class="panel" id="aip">
  <div class="ph">
    <span style="font-size:22px">&#x1F916;</span>
    <span class="pt">AI দিয়ে স্বপ্নের ব্যাখ্যা</span>
    <button class="pc" onclick="closeAll()">&#x2715;</button>
  </div>
  <div class="air">
    <input type="text" id="ai" placeholder="আপনার স্বপ্নের বিস্তারিত লিখুন...">
    <button class="bask" onclick="askAI()">জিজ্ঞেস করুন</button>
  </div>
  <div class="ar" id="ar">স্বপ্নের বিষয় লিখুন এবং জিজ্ঞেস করুন বোতামে চাপ দিন।</div>
</div>

<div class="panel" id="setp">
  <div class="ph">
    <span style="font-size:22px">&#x2699;&#xFE0F;</span>
    <span class="pt">Gemini API Key</span>
    <button class="pc" onclick="closeAll()">&#x2715;</button>
  </div>
  <div class="si-row">
    <div class="si-label">&#x1F511; Google Gemini API Key</div>
    <input type="password" class="si-inp" id="akInp" placeholder="AIza...">
    <div class="si-note">&#x1F512; Key শুধু আপনার ডিভাইসে থাকবে। পেতে: aistudio.google.com/app/apikey</div>
  </div>
  <button class="si-save" onclick="saveKey()">&#x1F4BE; সেভ করুন</button>
</div>

<div class="panel" id="fsp">
  <div class="ph">
    <span style="font-size:22px">&#x1F524;</span>
    <span class="pt">ফন্ট সাইজ</span>
    <button class="pc" onclick="closeAll()">&#x2715;</button>
  </div>
  <div class="fs-row">
    <button class="fsb" onclick="chFS(-1)">&#x2212;</button>
    <span class="fsv" id="fsVal">15px</span>
    <button class="fsb" onclick="chFS(1)">&#x2B;</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
var SF=["ইমাম মুহাম্মদ ইবনে সীরীন (রহ.)", "ইমাম নাবুলুসী (রহ.)", "শায়খ আব্দুল গনী নাবুলুসী (রহ.)", "ইমাম ইবনে কাসীর (রহ.)", "ইমাম আবু হামিদ গাজ্জালী (রহ.)", "ইমাম আব্দুল ওয়াহহাব শা'রানী (রহ.)"];
var SS=["ইবনে সীরীন", "নাবুলুসী", "আ.গ. নাবুলুসী", "ইবনে কাসীর", "গাজ্জালী", "শা'রানী"];
var SK=["s1","s2","s3","s4","s5","s6"];
var D=[{id:1,cat:"water",ic:"&#x1F4A7;",t:"পরিষ্কার পানি দেখা",kw:"পানি,নদী,খাল,পুকুর",s1:"পরিষ্কার পানি দেখা জীবনে বরকত ও সুখের আলামত। প্রবহমান পানি দীর্ঘ জীবন ও সুস্বাস্থ্যের ইঙ্গিত দেয়।",s2:"স্বচ্ছ পানি রহমত ও নিয়ামতের প্রতীক। পানি পান করা রিজিক বৃদ্ধির সুসংবাদ।",s3:"স্বপ্নে পানি দেখা ইলম ও হেদায়েতের প্রতীক। ঝরনার পানি আল্লাহর খাস রহমতের ইঙ্গিত।",s4:"ইবনে কাসীর (রহ.) বলেন, পানি জীবনের উৎস। পবিত্র পানি দেখা ঈমানের সতেজতার ইঙ্গিত।",s5:"গাজ্জালী (রহ.) বলেন, পানি জ্ঞান ও প্রজ্ঞার প্রতীক। পরিষ্কার পানি বিশুদ্ধ অন্তরের ইঙ্গিত।",s6:"শা'রানী (রহ.) বলেন, পানি দেখা আত্মার পরিশুদ্ধতার ইঙ্গিত। তওবা ও ইস্তেগফারের আলামত।",dua_ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا",dua_bn:"হে আল্লাহ! আমি আপনার কাছে উপকারী জ্ঞান ও পবিত্র রিজিক চাই।",karanio:"এই স্বপ্ন দেখলে দুই রাকাত শুকরিয়ার নামাজ পড়ুন এবং বেশি বেশি ইস্তেগফার করুন।"},
{id:2,cat:"water",ic:"&#x1F30A;",t:"সমুদ্রে ডুব দেওয়া",kw:"সমুদ্র,ডুব,সাঁতার,গভীর",s1:"সমুদ্রে ডুব দিয়ে জীবিত উঠে আসা শক্তিশালী ব্যক্তির সাথে সম্পর্ক থেকে উপকার লাভের ইঙ্গিত।",s2:"গভীর সমুদ্রে সাঁতার কাটা বড় বিপদ থেকে উদ্ধার পাওয়ার ইঙ্গিত।",s3:"সমুদ্র হলো দুনিয়ার প্রতীক। তাতে ডুব দেওয়া দুনিয়াবী বিষয়ে গভীরভাবে জড়িত হওয়ার ইঙ্গিত।",s5:"গাজ্জালী (রহ.) বলেন, সমুদ্র দুনিয়ার বিশালতার প্রতীক। ডুব দিয়ে সুরক্ষিত থাকা আল্লাহর হেফাজতের ইঙ্গিত।"},
{id:3,cat:"water",ic:"&#x1F327;",t:"বৃষ্টি দেখা",kw:"বৃষ্টি,ঝড়,বর্ষা,মেঘ",s1:"বৃষ্টি দেখা রহমত ও বরকতের আলামত। ঘরের উপর বৃষ্টি পড়া সে পরিবারে নিয়ামত নাজিলের ইঙ্গিত।",s2:"মৌসুমী বৃষ্টি জীবিকার সমৃদ্ধির ইঙ্গিত। ঝড়ো বৃষ্টি কষ্টের পর সুদিন আসার আলামত।",s3:"বৃষ্টি আল্লাহর রহমতের প্রতীক। দোয়া কবুল হওয়ার সুসংবাদ বহন করে।",s4:"ইবনে কাসীর (রহ.) বলেন, বৃষ্টি আল্লাহর রহমতের নিদর্শন। বৃষ্টিতে ভেজা বরকত লাভের ইঙ্গিত।",s6:"শা'রানী (রহ.) বলেন, বৃষ্টি দেখা মানুষের জন্য রহমত বর্ষণের ইঙ্গিত।"},

function togPanel(id){
  var p=document.getElementById(id);
  var ov=document.getElementById("ov");
  var opening=!p.classList.contains("open");
  document.querySelectorAll(".panel").forEach(function(el){el.classList.remove("open");});
  if(opening){p.classList.add("open");ov.classList.add("open");}
  else{ov.classList.remove("open");}
}

function closeAll(){
  document.querySelectorAll(".panel").forEach(function(el){el.classList.remove("open");});
  document.getElementById("ov").classList.remove("open");
}

function chFS(d){
  fsz=Math.min(22,Math.max(12,fsz+d));
  document.body.style.fontSize=fsz+"px";
  document.getElementById("fsVal").textContent=fsz+"px";
}

function lsGet(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}

    panels+="<div class=\"tp"+(def===SK[si]?" active":"")+"\" id=\"p"+d.id+SK[si]+"\">"
      +"<span class=\"sb2\">"+SF[si]+"</span><p>"+d[SK[si]]+"</p>"
      +(i===0?duaHtml:"")
      +"</div>";
  }
  return "<div class=\"dc\" id=\"dc"+d.id+"\">"
    +"<div class=\"dh\" onclick=\"togD("+d.id+")\">"
    +"<span class=\"di\">"+d.ic+"</span>"
    +"<div class=\"dtw\"><div class=\"dt\">"+d.t+"</div><div class=\"dk\">"+kwh+"</div></div>"
    +"<span class=\"de\">"+(isOpen?"&#x25B2;":"&#x25BC;")+"</span>"
    +"</div>"
    +"<div class=\"db"+(isOpen?" open":"")+"\" id=\"db"+d.id+"\">"
    +"<div class=\"tr\">"+tabs+"</div>"
    +"<div class=\"tc\">"+panels+"</div>"
    +"</div></div>";
}

function buildList(list){var h="";for(var i=0;i<list.length;i++){h+=buildCard(list[i]);}return h;}

    +"<div class=\"cg\">"+buildGrid()+"</div>";

function showCatPage(){document.getElementById("mc").innerHTML="<div class=\"cg\">"+buildGrid()+"</div>";}

function showAll(){
  document.getElementById("mc").innerHTML=
    "<div class=\"sh2\"><span class=\"shi\">&#x1F4D6;</span><span class=\"sht\">&#x09B8;&#x0995;&#x09B2; ("+D.length+"&#x099F;&#x09BF;)</span></div>"
    +"<div class=\"dl\">"+buildList(D)+"</div>";
}

function showAbout(){
  var sh="";for(var i=0;i<SF.length;i++){sh+="<p style=\"margin-bottom:6px\"><strong>"+SF[i]+"</strong></p>";}

    +"<div class=\"acard\"><h3>&#x1F4DA; &#x0986;&#x09B2;&#x09C7;&#x09AE;&#x0997;&#x09A3;</h3>"+sh+"</div>"
    +"<div class=\"acard\"><h3>&#x26A0;&#xFE0F; &#x09A8;&#x09CB;&#x099F;</h3><p>&#x09B8;&#x09CD;&#x09AC;&#x09AA;&#x09CD;&#x09A8;&#x09C7;&#x09B0; &#x09AC;&#x09CD;&#x09AF;&#x09BE;&#x0996;&#x09CD;&#x09AF;&#x09BE; &#x09B8;&#x09AC;&#x09B8;&#x09AE;&#x09AF;&#x09BC; &#x09A8;&#x09BF;&#x09B6;&#x09CD;&#x099A;&#x09BF;&#x09A4; &#x09A8;&#x09AF;&#x09BC;&#x0964; AI &#x09AC;&#x09CD;&#x09AF;&#x09BE;&#x0996;&#x09CD;&#x09AF;&#x09BE; &#x09B6;&#x09C1;&#x09A7;&#x09C1; &#x09B8;&#x09B9;&#x09BE;&#x09AF;&#x09BC;&#x09A4;&#x09BE;&#x09B0; &#x099C;&#x09A8;&#x09CD;&#x09AF;&#x0964;</p></div>"
    +"<div class=\"acard\"><h3>&#x1F468;&#x200D;&#x1F4BB; &#x09A1;&#x09C7;&#x09AD;&#x09C7;&#x09B2;&#x09AA;&#x09BE;&#x09B0;</h3><p><strong>A.M. Morshed</strong> | v4.0 | "+D.length+"&#x099F;&#x09BF; &#x09B8;&#x09CD;&#x09AC;&#x09AA;&#x09CD;&#x09A8;</p></div>";
}

function showTab(t){
  curTab=t;
  var tabs=document.querySelectorAll(".tab");
  var names=["home","cat","all","about"];
  for(var i=0;i<tabs.length;i++){tabs[i].classList.toggle("active",names[i]===t);}
  if(t==="home")showHome();
  else if(t==="cat")showCatPage();
  else if(t==="all")showAll();
  else if(t==="about")showAbout();
}

function goBack(){showTab(curTab==="home"?"home":"cat");}

function togD(id){
  openId=(openId===id?null:id);
  var body=document.getElementById("db"+id);
  var card=document.getElementById("dc"+id);
  if(body){
    body.classList.toggle("open",openId===id);
    var exp=card.querySelector(".de");
    if(exp)exp.innerHTML=(openId===id?"&#x25B2;":"&#x25BC;");
  }
}

function swP(did,p){
  openPanel[did]=p;
  var d=null;for(var i=0;i<D.length;i++){if(D[i].id===did){d=D[i];break;}}
  if(!d)return;
  var schs=getSch(d);
  for(var i=0;i<SK.length;i++){var el=document.getElementById("p"+did+SK[i]);if(el)el.classList.toggle("active",SK[i]===p);}
  var card=document.getElementById("dc"+did);
  if(card){
    var btns=card.querySelectorAll(".tb");
    for(var i=0;i<btns.length;i++){btns[i].classList.remove("active");}
    for(var i=0;i<schs.length;i++){if(SK[schs[i]]===p&&btns[i]){btns[i].classList.add("active");break;}}
  }
}

function onSrch(val){
  document.getElementById("bc").style.display=val?"block":"none";
  if(!val.trim()){showTab(curTab);return;}
  var q=val.trim().toLowerCase();
  var res=[];
  for(var i=0;i<D.length;i++){
    var d=D[i];
    var txt=d.t+" "+d.kw+" "+(d.s1||"")+" "+(d.s2||"")+" "+(d.s3||"")+" "+(d.s4||"")+" "+(d.s5||"")+" "+(d.s6||"");
    if(txt.toLowerCase().indexOf(q)>=0)res.push(d);
  }
  var m=document.getElementById("mc");
  if(!res.length){
    m.innerHTML="<div class=\"nr\"><div style=\"font-size:36px\">&#x1F50D;</div><p>"+val+" &#x098F;&#x09B0; &#x099C;&#x09A8;&#x09CD;&#x09AF; &#x09AC;&#x09CD;&#x09AF;&#x09BE;&#x0996;&#x09CD;&#x09AF;&#x09BE; &#x09AA;&#x09BE;&#x0993;&#x09AF;&#x09BC;&#x09BE; &#x09AF;&#x09BE;&#x09AF;&#x09BC;&#x09A8;&#x09BF;&#x0964;</p></div>";
    return;
  }
  m.innerHTML="<div class=\"rc\">&#x1F50D; "+val+" &#x2014; "+res.length+"&#x099F;&#x09BF; &#x09AB;&#x09B2;&#x09BE;&#x09AB;&#x09B2;</div><div class=\"dl\">"+buildList(res)+"</div>";
}

function clrSrch(){
  document.getElementById("si").value="";
  document.getElementById("bc").style.display="none";
  showTab(curTab);
}

async function askAI(){
  var inp=document.getElementById("ai").value.trim();
  if(!inp){shToast("&#x09B8;&#x09CD;&#x09AC;&#x09AA;&#x09CD;&#x09A8;&#x09C7;&#x09B0; &#x09AC;&#x09BF;&#x09B7;&#x09AF;&#x09BC; &#x09B2;&#x09BF;&#x0996;&#x09C1;&#x09A8;");return;}
  var apiKey=lsGet("gak");
  if(!apiKey){shToast("&#x09AA;&#x09CD;&#x09B0;&#x09A5;&#x09AE;&#x09C7; API Key &#x09B8;&#x09C7;&#x099F; &#x0995;&#x09B0;&#x09C1;&#x09A8;");togSet();return;}
  var ar=document.getElementById("ar");
  ar.innerHTML="&#x23F3; AI &#x09AC;&#x09BF;&#x09B6;&#x09CD;&#x09B2;&#x09C7;&#x09B7;&#x09A3; &#x0995;&#x09B0;&#x099B;&#x09C7;...";
  try{
    var prompt="&#x0986;&#x09AA;&#x09A8;&#x09BF; &#x098F;&#x0995;&#x099C;&#x09A8; &#x09AC;&#x09BF;&#x09B6;&#x09C7;&#x09B7;&#x099C;&#x09CD;&#x099E; &#x0987;&#x09B8;&#x09B2;&#x09BE;&#x09AE;&#x09C0; &#x09B8;&#x09CD;&#x09AC;&#x09AA;&#x09CD;&#x09A8; &#x09AC;&#x09CD;&#x09AF;&#x09BE;&#x0996;&#x09CD;&#x09AF;&#x09BE;&#x0995;&#x09BE;&#x09B0;&#x09C0;&#x0964; &#x09EC; &#x0986;&#x09B2;&#x09C7;&#x09AE;&#x09C7;&#x09B0; &#x09AE;&#x09A4;&#x09BE;&#x09AE;&#x09A4;&#x09C7;&#x09B0; &#x09AD;&#x09BF;&#x09A4;&#x09CD;&#x09A4;&#x09BF;&#x09A4;&#x09C7; &#x09AC;&#x09BE;&#x0982;&#x09B2;&#x09BE;&#x09AF;&#x09BC; &#x09AC;&#x09BF;&#x09B8;&#x09CD;&#x09A4;&#x09BE;&#x09B0;&#x09BF;&#x09A4; &#x09AC;&#x09CD;&#x09AF;&#x09BE;&#x0996;&#x09CD;&#x09AF;&#x09BE; &#x09A6;&#x09BF;&#x09A8;&#x0964; &#x09B6;&#x09C7;&#x09B7;&#x09C7; &#x0995;&#x09B0;&#x09A3;&#x09C0;&#x09AF;&#x09BC; &#x0993; &#x09A6;&#x09CB;&#x09AF;&#x09BC;&#x09BE; &#x09A6;&#x09BF;&#x09A8;&#x0964; &#x09B8;&#x09CD;&#x09AC;&#x09AA;&#x09CD;&#x09A8;: "+inp;
    var res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+apiKey,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1200,temperature:0.7}})
    });
    var data=await res.json();
    if(data.error){ar.innerHTML="&#x274C; Error: "+data.error.message;return;}
    var text="&#x0989;&#x09A4;&#x09CD;&#x09A4;&#x09B0; &#x09AA;&#x09BE;&#x0993;&#x09AF;&#x09BC;&#x09BE; &#x09AF;&#x09BE;&#x09AF;&#x09BC;&#x09A8;&#x09BF;&#x0964;";
    if(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]){
      text=data.candidates[0].content.parts[0].text;
    }
    ar.innerHTML=text.split("\n").join("<br>");
  }catch(e){ar.innerHTML="&#x274C; AI &#x09B8;&#x0982;&#x09AF;&#x09CB;&#x0997; &#x09AC;&#x09CD;&#x09AF;&#x09B0;&#x09CD;&#x09A5;&#x0964; &#x0987;&#x09A8;&#x09CD;&#x099F;&#x09BE;&#x09B0;&#x09A8;&#x09C7;&#x099F; &#x09AA;&#x09B0;&#x09C0;&#x0995;&#x09CD;&#x09B7;&#x09BE; &#x0995;&#x09B0;&#x09C1;&#x09A8;&#x0964;";}
}

function shToast(msg){
  var t=document.getElementById("toast");
  t.innerHTML=msg;
  t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");},2500);
}

showHome();
