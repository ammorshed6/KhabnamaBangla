<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>সোলাইমানী খাবনামা</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600&display=swap');
:root{--em:#1b4d3e;--el:#2d6a4f;--go:#b8860b;--gl:#d4a017;--gp:#f0e0a0;--rd:#8b1a1a;--cr:#faf6ed;--pg:#f5efe0;--pd:#e8dcc5;--sh:rgba(26,16,8,0.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans Bengali",sans-serif;background:var(--pg);color:#1a1008;min-height:100vh;font-size:15px}
header{background:linear-gradient(135deg,var(--em),#0d2b22);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px var(--sh);border-bottom:2px solid var(--go)}
.ht{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px}
.htc{display:flex;flex-direction:column;align-items:center;flex:1}
.at{font-family:"Noto Serif Bengali",serif;font-size:20px;font-weight:700;color:var(--gl)}
.as{font-size:11px;color:#a8c5b0;margin-top:1px}
.wm{background:var(--rd);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:3px}
.sw{padding:8px 12px 10px;display:flex;gap:8px;align-items:center}
.sb{flex:1;display:flex;align-items:center;background:rgba(255,255,255,0.12);border:1px solid rgba(212,160,23,0.4);border-radius:24px;overflow:hidden}
.si{padding:0 10px;color:var(--gl);font-size:16px}
#si{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:"Noto Sans Bengali",sans-serif;font-size:14px;padding:9px 0}
#si::placeholder{color:rgba(255,255,255,0.5)}
#bc{background:none;border:none;color:rgba(255,255,255,0.6);padding:0 10px;font-size:18px;cursor:pointer;display:none}
.ba{background:linear-gradient(135deg,var(--go),var(--gl));border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,0.3);flex-shrink:0}
.tabs{display:flex;background:var(--pd);border-bottom:2px solid var(--go)}
.tab{flex:1;padding:10px 4px;font-size:11px;font-family:"Noto Sans Bengali",sans-serif;font-weight:500;color:#5a4a30;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.tab.active{color:var(--em);border-bottom-color:var(--em);font-weight:600;background:rgba(27,77,62,0.08)}
main{padding:12px;min-height:calc(100vh - 130px)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.cc{background:linear-gradient(135deg,var(--cr),#efe6cc);border:1px solid var(--gp);border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 8px var(--sh);position:relative;overflow:hidden}
.cc:active{transform:scale(0.97)}
.cc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--go),var(--em))}
.ci{font-size:26px;margin-bottom:6px}
.cn{font-family:"Noto Serif Bengali",serif;font-size:13px;font-weight:600;color:var(--em)}
.ck{font-size:10px;color:#7a6040;margin-top:2px}
.dl{display:flex;flex-direction:column;gap:10px}
.dc{background:var(--cr);border:1px solid var(--gp);border-radius:10px;overflow:hidden;box-shadow:0 2px 6px var(--sh)}
.dh{display:flex;align-items:center;padding:10px 12px;gap:10px;cursor:pointer}
.di{font-size:22px;flex-shrink:0}
.dtw{flex:1}
.dt{font-family:"Noto Serif Bengali",serif;font-size:14px;font-weight:600;line-height:1.4}
.dk{font-size:11px;color:#8a7050;margin-top:2px}
.de{color:var(--go);font-size:18px}
.db{display:none;border-top:1px solid var(--gp)}
.db.open{display:block}
.tr{display:flex;background:var(--pd);border-bottom:1px solid var(--gp);overflow-x:auto}
.tb{flex-shrink:0;padding:6px 8px;font-size:10px;font-family:"Noto Sans Bengali",sans-serif;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:#6a5030;font-weight:500;white-space:nowrap}
.tb.active{color:var(--em);border-bottom-color:var(--em);font-weight:600}
.tc{padding:12px;font-size:13px;line-height:1.8;color:#2a1a08}
.tp{display:none}
.tp.active{display:block}
.sb2{display:inline-block;background:linear-gradient(90deg,var(--em),var(--el));color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;margin-bottom:6px}
.rc{font-size:12px;color:#7a6040;margin-bottom:10px;padding:6px 10px;background:var(--gp);border-radius:6px}
.ap{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--cr);border-top:2px solid var(--go);border-radius:16px 16px 0 0;padding:16px;max-height:70vh;overflow-y:auto;z-index:200;box-shadow:0 -4px 20px var(--sh)}
.ap.open{display:block}
.ah{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.at2{flex:1;font-family:"Noto Serif Bengali",serif;font-size:15px;font-weight:600;color:var(--em)}
.bca{background:none;border:none;font-size:22px;color:#8a6040;cursor:pointer}
.air{display:flex;gap:8px;margin-bottom:12px}
#ai{flex:1;border:1.5px solid var(--gp);border-radius:24px;padding:10px 14px;font-family:"Noto Sans Bengali",sans-serif;font-size:13px;background:#fff;outline:none}
#ai:focus{border-color:var(--em)}
.bask{background:linear-gradient(135deg,var(--em),var(--el));color:#fff;border:none;border-radius:24px;padding:10px 16px;font-family:"Noto Sans Bengali",sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.ar{background:#fff;border:1px solid var(--gp);border-radius:10px;padding:12px;font-size:13px;line-height:1.8;min-height:60px}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:199}
.ov.open{display:block}
.sh2{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.shi{font-size:20px}
.sht{font-family:"Noto Serif Bengali",serif;font-size:16px;font-weight:700;color:var(--em);flex:1}
.bbk{background:none;border:1px solid var(--go);border-radius:20px;padding:4px 12px;font-family:"Noto Sans Bengali",sans-serif;font-size:12px;color:var(--go);cursor:pointer}
.bism{text-align:center;font-family:"Noto Serif Bengali",serif;font-size:18px;color:var(--go);padding:14px;background:linear-gradient(135deg,var(--em),#0d2b22);border-radius:10px;margin-bottom:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--em);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:300;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
.acard{background:var(--cr);border:1px solid var(--gp);border-radius:10px;padding:16px;margin-bottom:10px}
.acard h3{font-family:"Noto Serif Bengali",serif;font-size:14px;font-weight:700;color:var(--em);margin-bottom:8px}
.acard p{font-size:13px;line-height:1.8;color:#3a2a10}
.nr{text-align:center;padding:30px 20px;color:#8a7050}
</style>
</head>
<body>
<header>
  <div class="ht">

    <div class="htc">
      <div class="at">&#x1F319; সোলাইমানী খাবনামা</div>
      <div class="as">ইসলামী স্বপ্নের ব্যাখ্যা &#x2014; ৬ আলেম</div>
    </div>
    <span class="wm">@A.M.MORSHED</span>
  </div>
  <div class="sw">
    <div class="sb">
      <span class="si">&#x1F50D;</span>
      <input type="text" id="si" placeholder="স্বপ্নের বিষয় লিখুন..." oninput="onSrch(this.value)">
      <button id="bc" onclick="clrSrch()">&#x2715;</button>

</header>
<div class="tabs">
  <button class="tab active" onclick="showTab('home')">&#x1F3E0; হোম</button>
  <button class="tab" onclick="showTab('cat')">&#x1F4C2; বিভাগ</button>
  <button class="tab" onclick="showTab('all')">&#x1F4D6; সব</button>
  <button class="tab" onclick="showTab('about')">&#x2139;&#xFE0F; পরিচিতি</button>
</div>
<main id="mc"></main>
<div class="ov" id="ov" onclick="togAI()"></div>
<div class="ap" id="ap">
  <div class="ah">
    <span style="font-size:24px">&#x1F916;</span>
    <span class="at2">AI দিয়ে স্বপ্নের ব্যাখ্যা নিন</span>
    <button class="bca" onclick="togAI()">&#x2715;</button>
  </div>
  <div class="air">
    <input type="text" id="ai" placeholder="আপনার স্বপ্নের বিস্তারিত লিখুন...">
    <button class="bask" onclick="askAI()">জিজ্ঞেস করুন</button>
  </div>
  <div class="ar" id="ar">আপনার স্বপ্নের বিষয় উপরে লিখুন এবং জিজ্ঞেস করুন বোতামে চাপ দিন।</div>
</div>

<script>
var SF=["ইমাম মুহাম্মদ ইবনে সীরীন (রহ.)","ইমাম নাবুলুসী (রহ.)","শায়খ আব্দুল গনী নাবুলুসী (রহ.)","ইমাম ইবনে কাসীর (রহ.)","ইমাম আবু হামিদ গাজ্জালী (রহ.)","ইমাম আব্দুল ওয়াহহাব শা'রানী (রহ.)"];
var SS=["ইবনে সীরীন","নাবুলুসী","আ.গ. নাবুলুসী","ইবনে কাসীর","গাজ্জালী","শা'রানী"];
var SK=["s1","s2","s3","s4","s5","s6"];
var D=[
{id:1,cat:"water",ic:"&#x1F4A7;",t:"পরিষ্কার পানি দেখা",kw:"পানি,নদী,খাল,পুকুর",s1:"পরিষ্কার পানি দেখা জীবনে বরকত ও সুখের আলামত। প্রবহমান পানি দীর্ঘ জীবন ও সুস্বাস্থ্যের ইঙ্গিত দেয়।",s2:"স্বচ্ছ পানি রহমত ও নিয়ামতের প্রতীক। পানি পান করা রিজিক বৃদ্ধির সুসংবাদ।",s3:"স্বপ্নে পানি দেখা ইলম ও হেদায়েতের প্রতীক। ঝরনার পানি আল্লাহর খাস রহমতের ইঙ্গিত।",s4:"ইবনে কাসীর (রহ.) বলেন, পানি জীবনের উৎস। পবিত্র পানি দেখা ঈমানের সতেজতার ইঙ্গিত।",s5:"গাজ্জালী (রহ.) বলেন, পানি জ্ঞান ও প্রজ্ঞার প্রতীক। পরিষ্কার পানি বিশুদ্ধ অন্তরের ইঙ্গিত।",s6:"শা'রানী (রহ.) বলেন, পানি দেখা আত্মার পরিশুদ্ধতার ইঙ্গিত। তওবা ও ইস্তেগফারের আলামত।"},
{id:2,cat:"water",ic:"&#x1F30A;",t:"সমুদ্রে ডুব দেওয়া",kw:"সমুদ্র,ডুব,সাঁতার,গভীর",s1:"সমুদ্রে ডুব দিয়ে জীবিত উঠে আসা শক্তিশালী ব্যক্তির সাথে সম্পর্ক থেকে উপকার লাভের ইঙ্গিত।",s2:"গভীর সমুদ্রে সাঁতার কাটা বড় বিপদ থেকে উদ্ধার পাওয়ার ইঙ্গিত।",s3:"সমুদ্র হলো দুনিয়ার প্রতীক। তাতে ডুব দেওয়া দুনিয়াবী বিষয়ে গভীরভাবে জড়িত হওয়ার ইঙ্গিত।",s5:"গাজ্জালী (রহ.) বলেন, সমুদ্র দুনিয়ার বিশালতার প্রতীক। ডুব দিয়ে সুরক্ষিত থাকা আল্লাহর হেফাজতের ইঙ্গিত।"},
{id:3,cat:"water",ic:"&#x1F327;",t:"বৃষ্টি দেখা",kw:"বৃষ্টি,ঝড়,বর্ষা,মেঘ",s1:"বৃষ্টি দেখা রহমত ও বরকতের আলামত। ঘরের উপর বৃষ্টি পড়া সে পরিবারে নিয়ামত নাজিলের ইঙ্গিত।",s2:"মৌসুমী বৃষ্টি জীবিকার সমৃদ্ধির ইঙ্গিত। ঝড়ো বৃষ্টি কষ্টের পর সুদিন আসার আলামত।",s3:"বৃষ্টি আল্লাহর রহমতের প্রতীক। দোয়া কবুল হওয়ার সুসংবাদ বহন করে।",s4:"ইবনে কাসীর (রহ.) বলেন, বৃষ্টি আল্লাহর রহমতের নিদর্শন। বৃষ্টিতে ভেজা বরকত লাভের ইঙ্গিত।",s6:"শা'রানী (রহ.) বলেন, বৃষ্টি দেখা মানুষের জন্য রহমত বর্ষণের ইঙ্গিত।"},
{id:4,cat:"water",ic:"&#x1F3CA;",t:"নদীতে গোসল করা",kw:"গোসল,নদী,পরিষ্কার,পবিত্র",s1:"পরিষ্কার নদীতে গোসল করা পাপ থেকে মুক্তি ও তওবা কবুলের ইঙ্গিত।",s2:"গোসল করা রোগ থেকে মুক্তির ইঙ্গিত। নদীর পানিতে গোসল দীর্ঘ সুস্বাস্থ্যের আলামত।",s5:"গাজ্জালী (রহ.) বলেন, গোসল করা আত্মার পরিশুদ্ধির প্রতীক। এটি তওবার আলামত।"},
{id:5,cat:"water",ic:"&#x26F5;",t:"নৌকায় ভ্রমণ",kw:"নৌকা,জাহাজ,সমুদ্র,নদী",s1:"নৌকায় ভ্রমণ নিরাপদ পথে জীবন পরিচালনার ইঙ্গিত। সুষ্ঠু নৌকা সাফল্যের প্রতীক।",s2:"নৌকায় ভ্রমণ জীবনের এক পর্যায় থেকে অন্য পর্যায়ে যাওয়ার ইঙ্গিত।",s3:"নৌকা জীবনের যানবাহনের প্রতীক। আল্লাহর উপর ভরসা করে পথ চলার ইঙ্গিত।",s4:"ইবনে কাসীর (রহ.) বলেন, নৌকা নূহ (আ.) এর কিস্তির স্মরণ করিয়ে দেয়। মুক্তির ইঙ্গিত।"},
{id:6,cat:"water",ic:"&#x1F41F;",t:"মাছ দেখা বা ধরা",kw:"মাছ,মৎস্য,ধরা,জাল",s1:"মাছ ধরা হালাল রিজিক ও সম্পদ লাভের ইঙ্গিত। বড় মাছ বড় নিয়ামতের আলামত।",s2:"জীবন্ত মাছ দেখা জীবিকার সমৃদ্ধির ইঙ্গিত।",s3:"মাছ ধরা হালাল উপায়ে জীবিকা অর্জনের ইঙ্গিত।",s4:"ইবনে কাসীর (রহ.) বলেন, মাছ সমুদ্রের সম্পদের প্রতীক। প্রচুর মাছ প্রচুর রিজিকের আলামত।"},

function showTab(t){
  curTab=t;
  var tabs=document.querySelectorAll(".tab");
  var names=["home","cat","all","about"];
  for(var i=0;i<tabs.length;i++){tabs[i].classList.toggle("active",names[i]===t);}
  if(t==="home")showHome();
  else if(t==="cat")showCatPage();
  else if(t==="all")showAll();
  else if(t==="about")showAbout();
}

function goBack(){showTab(curTab==="home"?"home":"cat");}

function togD(id){
  openId=(openId===id?null:id);
  var body=document.getElementById("db"+id);
  var card=document.getElementById("dc"+id);
  if(body){
    body.classList.toggle("open",openId===id);
    var exp=card.querySelector(".de");
    if(exp)exp.innerHTML=(openId===id?"&#x25B2;":"&#x25BC;");
  }
}

function swP(did,p){
  openPanel[did]=p;
  var d=null;for(var i=0;i<D.length;i++){if(D[i].id===did){d=D[i];break;}}
  if(!d)return;
  var schs=getSch(d);
  for(var i=0;i<SK.length;i++){var el=document.getElementById("p"+did+SK[i]);if(el)el.classList.toggle("active",SK[i]===p);}
  var card=document.getElementById("dc"+did);
  if(card){
    var btns=card.querySelectorAll(".tb");
    for(var i=0;i<btns.length;i++){btns[i].classList.remove("active");}
    for(var i=0;i<schs.length;i++){if(SK[schs[i]]===p&&btns[i]){btns[i].classList.add("active");break;}}
  }
}

function onSrch(val){
  document.getElementById("bc").style.display=val?"block":"none";
  if(!val.trim()){showTab(curTab);return;}
  var q=val.trim().toLowerCase();
  var res=[];
  for(var i=0;i<D.length;i++){
    var d=D[i];
    var txt=d.t+" "+d.kw+" "+(d.s1||"")+" "+(d.s2||"")+" "+(d.s3||"")+" "+(d.s4||"")+" "+(d.s5||"")+" "+(d.s6||"");
    if(txt.toLowerCase().indexOf(q)>=0)res.push(d);
  }
  var m=document.getElementById("mc");
  if(!res.length){m.innerHTML="<div class=\"nr\"><div style=\"font-size:40px\">&#x1F50D;</div><p>"+val+" &#x098F;&#x09B0; &#x099C;&#x09A8;&#x09CD;&#x09AF; &#x0995;&#x09CB;&#x09A8;&#x09CB; &#x09AC;&#x09CD;&#x09AF;&#x09BE;&#x0996;&#x09CD;&#x09AF;&#x09BE; &#x09AA;&#x09BE;&#x0993;&#x09AF;&#x09BC;&#x09BE; &#x09AF;&#x09BE;&#x09AF;&#x09BC;&#x09A8;&#x09BF;&#x0964;</p></div>";return;}

}
