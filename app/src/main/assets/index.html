<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>সোলাইমানী খাবনামা</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600&display=swap');
  :root{--ink:#1a1008;--parchment:#f5efe0;--parchment-dark:#e8dcc5;--gold:#b8860b;--gold-light:#d4a017;--gold-pale:#f0e0a0;--emerald:#1b4d3e;--emerald-light:#2d6a4f;--red:#8b1a1a;--cream:#faf6ed;--shadow:rgba(26,16,8,0.15)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans Bengali',sans-serif;background:var(--parchment);color:var(--ink);min-height:100vh;font-size:15px}
  header{background:linear-gradient(135deg,var(--emerald) 0%,#0d2b22 100%);padding:0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px var(--shadow);border-bottom:2px solid var(--gold)}
  .header-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px}
  .header-title{display:flex;flex-direction:column;align-items:center;flex:1}
  .app-title{font-family:'Noto Serif Bengali',serif;font-size:20px;font-weight:700;color:var(--gold-light);letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,0.4)}
  .app-subtitle{font-size:11px;color:#a8c5b0;letter-spacing:.5px;margin-top:1px}
  .watermark{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:3px;letter-spacing:.5px}
  .search-wrap{padding:8px 12px 10px;display:flex;gap:8px;align-items:center}
  .search-box{flex:1;display:flex;align-items:center;background:rgba(255,255,255,0.12);border:1px solid rgba(212,160,23,0.4);border-radius:24px;overflow:hidden}
  .search-icon{padding:0 10px;color:var(--gold-light);font-size:16px}
  #searchInput{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:'Noto Sans Bengali',sans-serif;font-size:14px;padding:9px 0}
  #searchInput::placeholder{color:rgba(255,255,255,0.5)}
  .btn-clear{background:none;border:none;color:rgba(255,255,255,0.6);padding:0 10px;font-size:18px;cursor:pointer;display:none}
  .btn-ai{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,0.3);flex-shrink:0}
  .tabs{display:flex;background:var(--parchment-dark);border-bottom:2px solid var(--gold);overflow-x:auto}
  .tab{flex:1;min-width:80px;padding:10px 6px;font-size:12px;font-family:'Noto Sans Bengali',sans-serif;font-weight:500;color:#5a4a30;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .2s;text-align:center;white-space:nowrap}
  .tab.active{color:var(--emerald);border-bottom-color:var(--emerald);font-weight:600;background:rgba(27,77,62,0.08)}
  main{padding:12px;min-height:calc(100vh - 130px)}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .cat-card{background:linear-gradient(135deg,var(--cream) 0%,#efe6cc 100%);border:1px solid var(--gold-pale);border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 8px var(--shadow);transition:transform .15s;position:relative;overflow:hidden}
  .cat-card:active{transform:scale(0.97)}
  .cat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--emerald))}
  .cat-icon{font-size:26px;margin-bottom:6px}
  .cat-name{font-family:'Noto Serif Bengali',serif;font-size:13px;font-weight:600;color:var(--emerald)}
  .cat-count{font-size:10px;color:#7a6040;margin-top:2px}
  .dream-list{display:flex;flex-direction:column;gap:10px}
  .dream-card{background:var(--cream);border:1px solid var(--gold-pale);border-radius:10px;overflow:hidden;box-shadow:0 2px 6px var(--shadow);cursor:pointer}
  .dream-header{display:flex;align-items:center;padding:10px 12px;gap:10px}
  .dream-icon{font-size:22px;flex-shrink:0}
  .dream-title-wrap{flex:1}
  .dream-title{font-family:'Noto Serif Bengali',serif;font-size:14px;font-weight:600;color:var(--ink);line-height:1.4}
  .dream-keywords{font-size:11px;color:#8a7050;margin-top:2px}
  .dream-expand{color:var(--gold);font-size:18px}
  .dream-body{display:none;border-top:1px solid var(--gold-pale)}
  .dream-body.open{display:block}
  .tafsir-tab-row{display:flex;background:var(--parchment-dark);border-bottom:1px solid var(--gold-pale)}
  .tafsir-btn{flex:1;padding:7px 4px;font-size:11px;font-family:'Noto Sans Bengali',sans-serif;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:#6a5030;font-weight:500}
  .tafsir-btn.active{color:var(--emerald);border-bottom-color:var(--emerald);font-weight:600}
  .tafsir-content{padding:12px;font-size:13px;line-height:1.8;color:#2a1a08}
  .tafsir-panel{display:none}
  .tafsir-panel.active{display:block}
  .scholar-badge{display:inline-block;background:linear-gradient(90deg,var(--emerald) 0%,var(--emerald-light) 100%);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;margin-bottom:6px}
  .result-count{font-size:12px;color:#7a6040;margin-bottom:10px;padding:6px 10px;background:var(--gold-pale);border-radius:6px}
  .ai-panel{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--cream);border-top:2px solid var(--gold);border-radius:16px 16px 0 0;padding:16px;max-height:70vh;overflow-y:auto;z-index:200;box-shadow:0 -4px 20px var(--shadow)}
  .ai-panel.open{display:block}
  .ai-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ai-icon{font-size:24px}
  .ai-title{flex:1;font-family:'Noto Serif Bengali',serif;font-size:15px;font-weight:600;color:var(--emerald)}
  .btn-close-ai{background:none;border:none;font-size:22px;color:#8a6040;cursor:pointer}
  .ai-input-row{display:flex;gap:8px;margin-bottom:12px}
  #aiInput{flex:1;border:1.5px solid var(--gold-pale);border-radius:24px;padding:10px 14px;font-family:'Noto Sans Bengali',sans-serif;font-size:13px;background:#fff;outline:none;color:var(--ink)}
  #aiInput:focus{border-color:var(--emerald)}
  .btn-ask{background:linear-gradient(135deg,var(--emerald) 0%,var(--emerald-light) 100%);color:#fff;border:none;border-radius:24px;padding:10px 16px;font-family:'Noto Sans Bengali',sans-serif;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .ai-response{background:#fff;border:1px solid var(--gold-pale);border-radius:10px;padding:12px;font-size:13px;line-height:1.8;color:var(--ink);min-height:60px}
  .ai-loading{text-align:center;color:var(--gold);font-size:22px;padding:10px}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:199}
  .overlay.open{display:block}
  .section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .section-head-icon{font-size:20px}
  .section-head-title{font-family:'Noto Serif Bengali',serif;font-size:16px;font-weight:700;color:var(--emerald);flex:1}
  .btn-back{background:none;border:1px solid var(--gold);border-radius:20px;padding:4px 12px;font-family:'Noto Sans Bengali',sans-serif;font-size:12px;color:var(--gold);cursor:pointer}
  .bismillah{text-align:center;font-family:'Noto Serif Bengali',serif;font-size:18px;color:var(--gold);padding:14px;background:linear-gradient(135deg,var(--emerald) 0%,#0d2b22 100%);border-radius:10px;margin-bottom:14px;letter-spacing:1px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--emerald);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:300;transition:transform .3s;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .about-card{background:var(--cream);border:1px solid var(--gold-pale);border-radius:10px;padding:16px;margin-bottom:10px;box-shadow:0 2px 6px var(--shadow)}
  .about-card h3{font-family:'Noto Serif Bengali',serif;font-size:14px;font-weight:700;color:var(--emerald);margin-bottom:8px}
  .about-card p{font-size:13px;line-height:1.8;color:#3a2a10}
  .no-result{text-align:center;padding:30px 20px;color:#8a7050}
  .no-result-icon{font-size:40px;margin-bottom:10px}
  .no-result p{font-size:14px}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div style="width:80px"></div>
    <div class="header-title">
      <div class="app-title">🌙 সোলাইমানী খাবনামা</div>
      <div class="app-subtitle">ইসলামী স্বপ্নের ব্যাখ্যা</div>
    </div>
    <span class="watermark">@A.M.MORSHED</span>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="স্বপ্নের বিষয় লিখুন..." oninput="onSearch(this.value)">
      <button class="btn-clear" id="btnClear" onclick="clearSearch()">✕</button>
    </div>
    <button class="btn-ai" onclick="toggleAI()">🤖</button>
  </div>
</header>
<div class="tabs">
  <button class="tab active" onclick="showTab('home')">🏠 হোম</button>
  <button class="tab" onclick="showTab('category')">📂 বিভাগ</button>
  <button class="tab" onclick="showTab('all')">📖 সব স্বপ্ন</button>
  <button class="tab" onclick="showTab('about')">ℹ️ পরিচিতি</button>
</div>
<main id="mainContent"></main>
<div class="overlay" id="overlay" onclick="toggleAI()"></div>
<div class="ai-panel" id="aiPanel">
  <div class="ai-header">
    <span class="ai-icon">🤖</span>
    <span class="ai-title">AI দিয়ে স্বপ্নের ব্যাখ্যা নিন</span>
    <button class="btn-close-ai" onclick="toggleAI()">✕</button>
  </div>
  <div class="ai-input-row">
    <input type="text" id="aiInput" placeholder="আপনার স্বপ্নের বিস্তারিত লিখুন...">
    <button class="btn-ask" onclick="askAI()">জিজ্ঞেস করুন</button>
  </div>
  <div class="ai-response" id="aiResponse">আপনার স্বপ্নের বিষয় উপরে লিখুন এবং "জিজ্ঞেস করুন" বোতামে চাপ দিন।</div>
</div>
<div class="toast" id="toast"></div>
<script>
const dreams=[
// ১. পানি ও নদী
{id:1,cat:'water',icon:'💧',title:'পরিষ্কার পানি দেখা',keywords:'পানি,নদী,খাল,পুকুর',ibnSirin:'পরিষ্কার পানি দেখা জীবনে বরকত ও সুখের আলামত। প্রবহমান পানি দীর্ঘ জীবন ও সুস্বাস্থ্যের ইঙ্গিত দেয়।',nabulusi:'স্বচ্ছ পানি রহমত ও নিয়ামতের প্রতীক। পানি পান করা হলে রিজিক বৃদ্ধির সুসংবাদ।',abdulghani:'স্বপ্নে পানি দেখা ইলম ও হেদায়েতের প্রতীক। ঝরনার পানি আল্লাহর খাস রহমতের ইঙ্গিত।'},
{id:2,cat:'water',icon:'🌊',title:'সমুদ্রে ডুব দেওয়া',keywords:'সমুদ্র,ডুব,সাঁতার,গভীর',ibnSirin:'সমুদ্রে ডুব দিয়ে জীবিত উঠে আসা রাজা বা শক্তিশালী ব্যক্তির সাথে সম্পর্ক থেকে উপকার লাভের ইঙ্গিত।',nabulusi:'গভীর সমুদ্রে সাঁতার কাটা বড় বিপদ থেকে উদ্ধার পাওয়ার ইঙ্গিত। উদ্ধার হলে আল্লাহর সাহায্য লাভ।',abdulghani:'সমুদ্র হলো দুনিয়ার প্রতীক। তাতে ডুব দেওয়া দুনিয়াবী বিষয়ে গভীরভাবে জড়িত হওয়ার ইঙ্গিত।'},
{id:3,cat:'water',icon:'🌧️',title:'বৃষ্টি দেখা',keywords:'বৃষ্টি,ঝড়,বর্ষা,মেঘ',ibnSirin:'বৃষ্টি দেখা রহমত ও বরকতের আলামত। ঘরের উপর বৃষ্টি পড়া সে পরিবারে নিয়ামত নাজিলের ইঙ্গিত।',nabulusi:'মৌসুমী বৃষ্টি জীবিকার সমৃদ্ধির ইঙ্গিত। ঝড়ো বৃষ্টি কষ্টের পর সুদিন আসার আলামত।',abdulghani:'বৃষ্টি আল্লাহর রহমতের প্রতীক। দোয়া কবুল হওয়ার সুসংবাদ বহন করে।'},
{id:4,cat:'water',icon:'🏊',title:'নদীতে গোসল করা',keywords:'গোসল,নদী,পরিষ্কার,পবিত্র',ibnSirin:'পরিষ্কার নদীতে গোসল করা পাপ থেকে মুক্তি ও তওবা কবুলের ইঙ্গিত। মনে শান্তি ও পবিত্রতার আলামত।',nabulusi:'গোসল করা রোগ থেকে মুক্তির ইঙ্গিত। নদীর পানিতে গোসল দীর্ঘ সুস্বাস্থ্যের আলামত।',abdulghani:'গোসল আত্মার পরিশুদ্ধতার প্রতীক। পরিষ্কার পানিতে গোসল গুনাহ মাফের ইঙ্গিত।'},
{id:5,cat:'water',icon:'⛵',title:'নৌকায় ভ্রমণ',keywords:'নৌকা,জাহাজ,সমুদ্র,নদী,ভ্রমণ',ibnSirin:'নৌকায় ভ্রমণ নিরাপদ পথে জীবন পরিচালনার ইঙ্গিত। সুষ্ঠু নৌকা সাফল্যের প্রতীক।',nabulusi:'নৌকায় ভ্রমণ করা জীবনের এক পর্যায় থেকে অন্য পর্যায়ে যাওয়ার ইঙ্গিত। নিরাপদ পৌঁছানো সাফল্যের আলামত।',abdulghani:'নৌকা জীবনের যানবাহনের প্রতীক। আল্লাহর উপর ভরসা করে পথ চলার ইঙ্গিত।'},
{id:6,cat:'water',icon:'🌊',title:'বন্যা দেখা',keywords:'বন্যা,প্লাবন,পানি বৃদ্ধি',ibnSirin:'বন্যা দেখা বিপদ ও পরীক্ষার ইঙ্গিত। তবে পানি সরে গেলে বিপদ কেটে যাওয়ার আলামত।',nabulusi:'বন্যায় ভেসে না যাওয়া বিপদ থেকে রক্ষার ইঙ্গিত। উঁচুতে উঠে বাঁচা আল্লাহর সাহায্যের আলামত।',abdulghani:'বন্যা ফিতনা ও বিপদের প্রতীক। দোয়া ও সবরের মাধ্যমে রক্ষা পাওয়ার ইঙ্গিত।'},
{id:7,cat:'water',icon:'🐟',title:'মাছ দেখা বা ধরা',keywords:'মাছ,মৎস্য,ধরা,জাল',ibnSirin:'মাছ ধরা হালাল রিজিক ও সম্পদ লাভের ইঙ্গিত। বড় মাছ বড় নিয়ামতের আলামত।',nabulusi:'জীবন্ত মাছ দেখা জীবিকার সমৃদ্ধির ইঙ্গিত। মাছ খাওয়া স্বাস্থ্য ও দীর্ঘায়ুর আলামত।',abdulghani:'মাছ সমুদ্রের সম্পদের প্রতীক। মাছ ধরা হালাল উপায়ে জীবিকা অর্জনের ইঙ্গিত।'},
{id:8,cat:'water',icon:'🌊',title:'কূপ বা ঝরনা দেখা',keywords:'কূপ,ঝরনা,প্রস্রবণ,উৎস',ibnSirin:'কূপ থেকে পানি তোলা জ্ঞান অর্জন ও উপকার লাভের ইঙ্গিত। ঝরনা দেখা বিশুদ্ধ রিজিকের আলামত।',nabulusi:'পরিষ্কার কূপ দেখা ভালো স্ত্রী বা বন্ধুর ইঙ্গিত। কূপ খনন করা শ্রম দিয়ে রিজিক উপার্জনের আলামত।',abdulghani:'ঝরনা আল্লাহর রহমতের উৎসের প্রতীক। ঝরনার পানি পান ইলম ও হেদায়েত লাভের ইঙ্গিত।'},

function renderCategory() {
  const d = document.getElementById('mainContent');
  const list = categories.map(c=>{
    const count = dreams.filter(x=>x.cat===c.id).length;
    return `<div class="cat-card" onclick="showCatDreams('${c.id}')">
      <div class="cat-icon">${c.icon}</div>
      <div class="cat-name">${c.name}</div>
      <div class="cat-count">${count}টি স্বপ্ন</div>
    </div>`;
  }).join('');
  d.innerHTML = `<div class="cat-grid">${list}</div>`;
}

// ===== SHOW CATEGORY DREAMS =====
function showCatDreams(catId) {
  currentCat = catId;
  const cat = categories.find(c=>c.id===catId);
  const list = dreams.filter(d=>d.cat===catId);
  const d = document.getElementById('mainContent');
  d.innerHTML = `
    <div class="section-head">
      <span class="section-head-icon">${cat.icon}</span>
      <span class="section-head-title">${cat.name}</span>
      <button class="btn-back" onclick="goBack()">← পিছনে</button>
    </div>
    <div class="dream-list">
      ${list.map(dream=>renderDreamCard(dream)).join('')}
    </div>`;
}

          <div class="dream-keywords">${dream.keywords.split(',').map(k=>`#${k.trim()}`).join(' ')}</div>
        </div>
        <span class="dream-expand">${isOpen?'▲':'▼'}</span>
      </div>
      <div class="dream-body ${isOpen?'open':''}" id="dreamBody${dream.id}">
        <div class="tafsir-tab-row">
          <button class="tafsir-btn ${activePanel==='ibnSirin'?'active':''}" onclick="switchTafsir(${dream.id},'ibnSirin')">ইবনে সীরীন</button>
          <button class="tafsir-btn ${activePanel==='nabulusi'?'active':''}" onclick="switchTafsir(${dream.id},'nabulusi')">নাবুলুসী</button>
          <button class="tafsir-btn ${activePanel==='abdulghani'?'active':''}" onclick="switchTafsir(${dream.id},'abdulghani')">আ.গ. নাবুলুসী</button>
        </div>
        <div class="tafsir-content">
          <div class="tafsir-panel ${activePanel==='ibnSirin'?'active':''}" id="tp${dream.id}ibnSirin">
            <span class="scholar-badge">ইমাম মুহাম্মদ ইবনে সীরীন (রহ.)</span>
            <p>${dream.ibnSirin}</p>
          </div>
          <div class="tafsir-panel ${activePanel==='nabulusi'?'active':''}" id="tp${dream.id}nabulusi">
            <span class="scholar-badge">ইমাম নাবুলুসী (রহ.)</span>
            <p>${dream.nabulusi}</p>
          </div>
          <div class="tafsir-panel ${activePanel==='abdulghani'?'active':''}" id="tp${dream.id}abdulghani">
            <span class="scholar-badge">শায়খ আব্দুল গনী নাবুলুসী (রহ.)</span>
            <p>${dream.abdulghani}</p>
          </div>
        </div>
      </div>
    </div>`;
}

// ===== TOGGLE DREAM =====
function toggleDream(id) {
  if(openDreamId === id) {
    openDreamId = null;
  } else {
    openDreamId = id;
  }
  const body = document.getElementById('dreamBody'+id);
  const card = document.getElementById('dreamCard'+id);
  if(body) {
    body.classList.toggle('open', openDreamId===id);
    // update expand arrow
    const header = card.querySelector('.dream-expand');
    if(header) header.textContent = openDreamId===id ? '▲' : '▼';
  }
}

// ===== SWITCH TAFSIR TAB =====
function switchTafsir(dreamId, panel) {
  openDreamTab[dreamId] = panel;
  const panels = ['ibnSirin','nabulusi','abdulghani'];
  panels.forEach(p=>{
    const el = document.getElementById(`tp${dreamId}${p}`);
    if(el) el.classList.toggle('active', p===panel);
  });
  const card = document.getElementById('dreamCard'+dreamId);
  if(card) {
    card.querySelectorAll('.tafsir-btn').forEach((btn,i)=>{
      btn.classList.toggle('active', panels[i]===panel);
    });
  }
}

// ===== SEARCH =====
function onSearch(val) {
  const btn = document.getElementById('btnClear');
  btn.style.display = val ? 'block' : 'none';
  if(!val.trim()) {
    showTab(currentTab);
    return;
  }
  const q = val.trim().toLowerCase();
  const results = dreams.filter(d=>
    d.title.toLowerCase().includes(q) ||
    d.keywords.toLowerCase().includes(q) ||
    d.ibnSirin.includes(q) ||
    d.nabulusi.includes(q) ||
    d.abdulghani.includes(q)
  );
  const d = document.getElementById('mainContent');
  if(results.length===0) {
    d.innerHTML = `<div class="no-result">
      <div class="no-result-icon">🔍</div>
      <p>"${val}" এর জন্য কোনো স্বপ্নের ব্যাখ্যা পাওয়া যায়নি।</p>
      <p style="margin-top:8px;font-size:12px;">AI দিয়ে জিজ্ঞেস করুন 🤖</p>
    </div>`;
    return;
  }
  d.innerHTML = `
    <div class="result-count">🔍 "${val}" — ${results.length}টি ফলাফল পাওয়া গেছে</div>
    <div class="dream-list">${results.map(dream=>renderDreamCard(dream)).join('')}</div>`;
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('btnClear').style.display = 'none';
  showTab(currentTab);
}

// ===== TABS =====
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', ['home','category','all','about'][i]===tab);
  });
  if(tab==='home') renderHome();
  else if(tab==='category') renderCategory();
  else if(tab==='all') renderAll();
  else if(tab==='about') renderAbout();
}

function goBack() {
  showTab(currentTab==='home'?'home':'category');
}

// ===== ABOUT =====

// ===== AI =====
function toggleAI() {
  const panel = document.getElementById('aiPanel');
  const overlay = document.getElementById('overlay');
  panel.classList.toggle('open');
  overlay.classList.toggle('open');
}

async function askAI() {
  const input = document.getElementById('aiInput').value.trim();
  if(!input) { showToast('স্বপ্নের বিষয় লিখুন'); return; }
  const resp = document.getElementById('aiResponse');
  resp.innerHTML = '<div class="ai-loading">⏳ AI বিশ্লেষণ করছে...</div>';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:`আপনি একজন বিশেষজ্ঞ ইসলামী স্বপ্ন ব্যাখ্যাকারী। ইমাম ইবনে সীরীন, ইমাম নাবুলুসী এবং শায়খ আব্দুল গনী নাবুলুসী (রহ.)-এর মতামতের ভিত্তিতে বাংলায় সংক্ষিপ্ত ও স্পষ্ট ব্যাখ্যা দিন। সবসময় বলুন যে এটি সম্ভাব্য ব্যাখ্যা, নিশ্চিত নয়।`,
        messages:[{role:'user', content:`এই স্বপ্নটির ইসলামী ব্যাখ্যা দিন: ${input}`}]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || 'উত্তর পাওয়া যায়নি।';
    resp.innerHTML = text.replace(/\n/g,'<br>');
  } catch(e) {
    resp.innerHTML = '❌ AI সংযোগ ব্যর্থ হয়েছে। ইন্টারনেট সংযোগ পরীক্ষা করুন।';
  }
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ===== INIT =====
renderHome();
</script>
